name: CD

on:
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 체크아웃
      uses: actions/checkout@v3

    - name: JDK 17 설정
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: application.yml 생성
      run: |
        mkdir -p src/main/resources
        echo "${{ secrets.APPLICATION }}" > src/main/resources/application.yml

    - name: gradle 빌드
      run: |
        chmod +x gradlew
        ./gradlew build -x test

    - name: Docker 환경 설정
      uses: docker/setup-buildx-action@v2.9.1

    - name: DockerHub 로그인
      uses: docker/login-action@v2.2.0
      with:
        username: ${{ secrets.DOCKERHUB_LOGIN_USERNAME }}
        password: ${{ secrets.DOCKERHUB_LOGIN_ACCESSTOKEN }}

    - name: Docker 이미지 빌드 및 푸시
      run: |
        docker build --platform linux/amd64 -t woals2840/certi-server .
        docker push woals2840/certi-server

  deploy-cd:
    needs: build
    runs-on: ubuntu-22.04

    steps:
    - name: EC2 배포 (Docker 컨테이너 재실행)
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.RELEASE_SERVER_IP }}
        username: ${{ secrets.RELEASE_SERVER_USER }}
        key: ${{ secrets.RELEASE_SERVER_KEY }}
        script: |
          docker rm -f certi-server || true
          docker pull woals2840/certi-server
          docker run -d --name certi-server -p 8080:8080 woals2840/certi-server
